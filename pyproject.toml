[project]
name = "eodh-raster-workflows"
version = "2.0.2"
description = "EODH raster workflows (NDVI, NDWI, clip) that write COGs with renderable STAC"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.2",
    "psutil>=5.9",
    "pystac>=1.14",
    "rasterio>=1.5",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "cwltool>=3.3.20260925135507",
    "jsonschema>=4.26.0",
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "rio-cogeo>=7.0.4",
    "ruff==0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
